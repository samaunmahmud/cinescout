# Test-only overrides, layered over the main application.yml.
# Tests register many accounts and call the AI endpoints many times from one address: rate limits would trip.
# RateLimitApiTest turns them back on.
cinescout.rate-limits.enabled=false
# One signing key for every test context: a cover photo's link is made through the static FileLinks.current(),
# which the last context started sets, and checked by the context serving the request.
cinescout.files.signing-key=test-signing-key
# Jobs run when a test calls them, never on the app's own timer.
cinescout.jobs.scheduler=false
# Spring keeps every distinct test context alive, each with its own pool, all on one PostgreSQL container
# (max_connections 100): a small pool keeps the suite well under that.
spring.datasource.hikari.maximum-pool-size=4
