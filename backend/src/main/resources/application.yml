spring:
  application:
    name: cinescout
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinescout}
    username: ${DB_USERNAME:cinescout}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false        # no lazy loading leaking into the (reactive) web layer
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks the mapping
  flyway:
    enabled: true
  codec:
    max-in-memory-size: 1MB    # a whole screenplay can be pasted in for import (the default is 256KB)
  webflux:
    multipart:                 # recce photos: one file of up to 10 MB a request, kept on disk while it arrives
      max-disk-usage-per-part: 10MB
      max-parts: 4

cinescout:
  mail:                        # reply tracking for outreach email; without these, replies are recorded by hand
    reply-domain: ${MAIL_REPLY_DOMAIN:}               # replies come to scout+<token>@<this domain>
    reply-local-part: ${MAIL_REPLY_LOCAL_PART:scout}
    inbound:
      provider: ${MAIL_INBOUND_PROVIDER:}             # postmark
      username: ${MAIL_INBOUND_USERNAME:}             # the HTTP Basic credentials in the provider's webhook URL
      password: ${MAIL_INBOUND_PASSWORD:}
  files:                       # uploaded files (recce photos). Render's disk is wiped on every deploy: set FILES_STORE=s3
    store: ${FILES_STORE:local}                       # local | s3 (Cloudflare R2 or any S3-compatible store)
    local-dir: ${FILES_DIR:${java.io.tmpdir}/cinescout-files}
    signing-key: ${FILES_SIGNING_KEY:}                # signs short-lived photo links; random per start when empty
    s3:
      endpoint: ${FILES_S3_ENDPOINT:}                 # e.g. https://<account>.r2.cloudflarestorage.com
      bucket: ${FILES_S3_BUCKET:}
      region: ${FILES_S3_REGION:auto}
      access-key: ${FILES_S3_ACCESS_KEY:}
      secret-key: ${FILES_S3_SECRET_KEY:}
  llm:
    watsonx:                   # the LLM client is only created when WATSONX_API_KEY is set
      api-key: ${WATSONX_API_KEY:}
      project-id: ${WATSONX_PROJECT_ID:}
      model-id: ${WATSONX_MODEL_ID:}
      base-url: ${WATSONX_URL:https://us-south.ml.cloud.ibm.com}
      max-requests-per-second: ${WATSONX_MAX_REQUESTS_PER_SECOND:2}   # the free (Lite) plan's limit
  search:
    parallel:                  # the search client is only created when PARALLEL_API_KEY is set
      api-key: ${PARALLEL_API_KEY:}
      base-url: ${PARALLEL_URL:https://api.parallel.ai}
  video:
    youtube:                   # venue videos exist only when YOUTUBE_API_KEY is set
      api-key: ${YOUTUBE_API_KEY:}
  rate-limits:                 # per user (ai, scouting, lookups) or per client address (login, register, guest):
    enabled: true              # a burst of `capacity` calls, then refilled evenly over `period`
    ai:        { capacity: 30,  period: 1h }
    scouting:  { capacity: 10,  period: 1h }
    lookups:   { capacity: 120, period: 1h }
    login:     { capacity: 20,  period: 10m }
    register:  { capacity: 5,   period: 1h }
    guest:     { capacity: 60,  period: 1h }   # answers through director links

server:
  port: ${PORT:8081}           # 8080 is used by the Node prototype

management:
  endpoints:
    web:
      exposure:
        include: health        # for container health checks; nothing else is exposed
  endpoint:
    health:
      show-details: never
