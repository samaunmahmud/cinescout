# Filming offices for permit guidance (feature: venues marked "Public space" show the office for their area).
#
# To correct an entry: edit it here, set lastReviewed to the day you checked, and open a pull request.
# Each office is matched on the ISO 3166-2 code OpenStreetMap gives for the venue's position (e.g. GB-CMD), or on
# one of its names. leadTime is in working days for filming on the street: smallCrew under 30 people, largeCrew 30
# or more; null where the source gives no figure. leadTimeText is the source's own wording.
# A venue outside every office listed here gets the fallback ("check with the local council").
lastReviewed: 2026-10-04
sources:
  - name: Film London, Borough Film Services contacts
    url: https://filmlondon.org.uk/resource/borough-film-services-contacts
  - name: Film London, Borough lead-in times (October 2021)
    url: https://film-london.files.svdcdn.com/production/Borough-Lead-in-times-Oct-2021.xlsx
checklist:
  - Dates, times, the number of cast and crew, and every vehicle you will bring
  - Public liability insurance certificate
  - Risk assessment for the shoot
  - Parking and unit base plan, with any parking suspensions you need
  - A letter to the residents and businesses nearby
  - Flag anything unusual early (stunts, special effects, weapons, drones, road closures)
fallback:
  area: Elsewhere in the UK
  office: The local council
  contactUrl: https://www.gov.uk/find-local-council
  note: CineScout's guide covers London's boroughs so far. Check with the local council's filming or events team.
