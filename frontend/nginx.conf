# The web app and its API on one origin: the session cookie then needs no CORS, and stays SameSite=Strict.
# ${BACKEND_URL} is filled in by the nginx image at start-up (envsubst).

# Behind another TLS proxy (Caddy, a load balancer), keep the scheme it saw, so the backend marks the session
# cookie Secure; talked to directly, it is ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Scouting runs web searches and an AI assessment per venue: it can take minutes.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # A recce photo may be up to 10 MB.
    client_max_body_size 11m;

    # The API rate-limits logins and sign-ups per client address. Believe X-Forwarded-For only from a proxy on a
    # private network (Caddy, a load balancer); anyone else could put any address in it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Map tiles may come from any https tile server (VITE_MAP_TILE_URL); Leaflet sets inline styles.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the client, as worked out above: one address, not a chain
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # The interactive API docs; remove these two blocks to keep them off a public deployment.
    location /v3/api-docs {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /swagger-ui {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built assets have content hashes in their names: cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages whose address is the permission (a shared call sheet, a director's shortlist, an invite): pages like any
    # other, but search engines are told to leave them alone and the address is not sent on as a referrer
    # (add_header here replaces the inherited ones, so they are all repeated).
    location ~ ^/(call-sheet|shortlist|invite)/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # Everything else is a page of the single-page app.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
